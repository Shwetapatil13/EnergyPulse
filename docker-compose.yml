version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: energypulse_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: energypulse
      MYSQL_USER: energyuser
      MYSQL_PASSWORD: energypass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "energyuser", "-penergypass123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
